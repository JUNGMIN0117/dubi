spring:
  application:
    name: ddubi

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ddubi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:ddubi}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # 스키마의 진실은 Flyway 다. Hibernate 는 절대 스키마를 건드리지 않고 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  jackson:
    # JSON 은 camelCase 다 (API 명세서 v2.1.1 기준). SNAKE_CASE 로 바꾸지 말 것 —
    # 프론트가 명세서 필드명(notifyLeadMin, unreadNotificationCount 등)으로 파싱한다.
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework # Nginx 뒤에서 X-Forwarded-* 반영

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ddubi

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

logging:
  pattern:
    # requestId 는 RequestIdFilter 가 MDC 에 넣는다. 장애 추적의 기준 키다.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

# --- 뚜비 도메인 설정 -------------------------------------------------
ddubi:
  jwt:
    secret: ${JWT_SECRET:} # 운영에서 반드시 주입. 비어 있으면 기동 실패시킬 것(Phase 1)
    access-token-validity: 60m
    refresh-token-validity: 14d
  recommendation:
    policy-version: v1.0
    # 중요도 → 백분위 (도메인 규칙 7)
    percentile:
      normal: 50
      high: 80
      critical: 95
    # 이 시간을 넘기면 202 + jobId 비동기로 전환 (성능 목표)
    sync-timeout: 2s
  external:
    kakao:
      # 장소 검색과 대중교통 길찾기에 사용하는 카카오맵 REST API 주소
      base-url: https://dapi.kakao.com
      public-transit-path: /v2/routing/publictraffic
      # 실제 값은 .env 또는 배포 환경변수로 넣고 저장소에는 절대 커밋하지 않는다.
      rest-api-key: ${KAKAO_REST_API_KEY:}
  transit-master-import:
    # 평상시 기동에는 반드시 false다. 관리자가 공식 파일을 새 버전으로 적재할 때만 true로 실행한다.
    enabled: ${DDUBI_TRANSIT_MASTER_IMPORT_ENABLED:false}
    data-version: ${DDUBI_TRANSIT_MASTER_DATA_VERSION:}
    bus-workbook: ${DDUBI_TRANSIT_MASTER_BUS_WORKBOOK:}
    subway-timetable: ${DDUBI_TRANSIT_MASTER_SUBWAY_TIMETABLE:}
    # [{"lineNumber":"2","subwayId":"1002","staticStationCode":"0222","externalCode":"222","realtimeStationId":"1002000222"}] 형식
    subway-realtime-stations: ${DDUBI_TRANSIT_MASTER_SUBWAY_REALTIME_STATIONS:}
    # 검증된 카카오 별칭 배열 JSON. verified=true인 행만 Matcher가 사용한다.
    aliases: ${DDUBI_TRANSIT_MASTER_ALIASES:}
  transit-mapping:
    # 다른 Backend replica가 새 ACTIVE 마스터 버전을 발견하는 최대 주기(ms)
    refresh-interval-ms: ${DDUBI_TRANSIT_MAPPING_REFRESH_INTERVAL_MS:60000}
    bus:
      # BUS EXACT 품질 게이트(m). golden corpus의 endpoint 거리 분포로 조정하며 소요시간 가중치가 아니다.
      max-endpoint-distance-meters: ${DDUBI_BUS_MAPPING_MAX_ENDPOINT_DISTANCE_METERS:150}
