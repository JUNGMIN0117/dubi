global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus 는 서버2(서비스)에서 돈다.
# 서버1 대상은 사설 IP 로 원격 스크랩 (서버1: 172.26.15.35 / 서버2: 172.26.6.220)
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # 서버 자원 (CPU/메모리/디스크/네트워크)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]        # 서버2 (같은 도커 네트워크)
        labels: { server: server2-service }
      - targets: ["172.26.15.35:9100"]         # 서버1 (exporters 프로필)
        labels: { server: server1-data }

  # Kafka 토픽·컨슈머 랙 (서버1의 kafka-exporter)
  - job_name: kafka
    static_configs:
      - targets: ["172.26.15.35:9308"]
        labels: { server: server1-data }

  # backend(Spring actuator). 같은 도커 네트워크 안에서 직접 읽는다 — nginx 는 /api·/internal 만 열어 두어
  # /actuator 는 바깥에서 닿지 않는다. up{job="backend"} 가 0 이면 backend 가 죽은 것 (2026-09-07 추가)
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels: { server: server2-service }

  # 이후 추가 예정: Spark 지표, mysqld-exporter, redis-exporter, HDFS(JMX)
